<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>غير متصل بالإنترنت | فوج القدس - سيدي داود</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<style>
  :root { --green:#2E7D32; --gold:#FFD700; }
  * { box-sizing: border-box; }
  body {
    margin:0; font-family: -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    background:#f5f5f5; color:#333; min-height:100vh;
    display:flex; align-items:center; justify-content:center; text-align:center; padding:2rem;
  }
  .box { max-width: 460px; }
  .icon { font-size: 4rem; margin-bottom: 1rem; }
  h1 { color: var(--green); margin: 0 0 .75rem; font-size: 1.6rem; }
  p { line-height: 1.8; opacity: .85; margin-bottom: 1.5rem; }
  button {
    background: var(--green); color:#fff; border:none; padding: .8rem 1.8rem;
    border-radius: 999px; font-size:1rem; cursor:pointer;
  }
  button:hover { opacity:.9; }
  .brand { margin-top: 2.5rem; font-size:.85rem; opacity:.6; }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">📡</div>
    <h1>أنت غير متصل بالإنترنت</h1>
    <p>تعذّر الاتصال بالشبكة حالياً. الصفحات التي سبق أن زرتها قد تكون متوفرة في الذاكرة المؤقتة — أعد الاتصال بالإنترنت وحاول مجدداً.</p>
    <button onclick="window.location.reload()">إعادة المحاولة</button>
    <div class="brand">قدماء الكشافة الإسلامية الجزائرية - فوج القدس - سيدي داود</div>
  </div>
</body>
</html>
